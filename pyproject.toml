[project]
name = "pi-agent-platform"
version = "0.1.0"
description = "A small FastAPI + Alpine.js platform for Pi RPC agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "tinydb>=4.8.2",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
venvPath = "."
venv = ".venv"

